name: Import uploaded Ascend icons
on:
  push:
    branches: [ascend-2.7.6-user-icons]
    paths: [.github/workflows/import-ascend-icons.yml]
permissions:
  contents: write
jobs:
  import_icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original user icon crops
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/selected-icons
          curl --fail --location --retry 3 'https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F46204528-9173-4899-8341-c6f643b21ad8/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAKyj785wY8COWwHoj7Zzj75PKch2aqpnlkR1IX6bF0TF&exp=1794029316&osig=AAAAAAAAAAAAAAAAAAAAAPDeOYosuiYrASU7zuwO2MvuKrWqtoTL1Gt4To64CgSs&signer=media-rpc&token=AAIAAU0AJDQ2MjA0NTI4LTkxNzMtNDg5OS04MzQxLWM2ZjY0M2IyMWFkOAAAAAABobR656AYwrBfGI5j9x9Gu7-HYTnrkyh2bMDXTTi4Aam0NjyPZA&x-canva-quality=thumbnail' -o 'assets/selected-icons/sunny-sprite.jpg'
          curl --fail --location --retry 3 'https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2Fdfad960b-7991-4f1f-9864-36147ebffa68/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAABWtBHnTXh-hD6GNfM5QIQrwhgZT2S4fsYojp_a0DFYh&exp=1794027450&osig=AAAAAAAAAAAAAAAAAAAAACh2AQ_aQE4_th3Okp_HuT1O2b50dM2uvklPom0H83Qf&signer=media-rpc&token=AAIAAU0AJGRmYWQ5NjBiLTc5OTEtNGYxZi05ODY0LTM2MTQ3ZWJmZmE2OAAAAAABobRebpCFimySWvJxQ1q_HhfvJOr0aCFb7i2jyGDg2YAisAg-Iw&x-canva-quality=thumbnail' -o 'assets/selected-icons/mono-peek.jpg'
          curl --fail --location --retry 3 'https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F107539ae-6597-4d3d-9e74-0f194991fde2/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAOk8Hf2dvb7CD6l6OnwFhbDAcNn82P0MCuK8llEXCRnD&exp=1794027763&osig=AAAAAAAAAAAAAAAAAAAAADJIzf-7_ACKIrSjBGN5FGCBYX3m2cdQrGJJX4i0Oy_-&signer=media-rpc&token=AAIAAU0AJDEwNzUzOWFlLTY1OTctNGQzZC05ZTc0LTBmMTk0OTkxZmRlMgAAAAABobRjNTiguQpo24XX3TNkwBAnDihv5Z_y5G5koFvFwA41hnbM7Q&x-canva-quality=thumbnail' -o 'assets/selected-icons/red-cat.jpg'
          curl --fail --location --retry 3 'https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F0134b9cc-3ca6-47bb-93cb-0159a5a7047c/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAEzOtknSbX_YoPHG90jLt-Ag26SeOukdTvwASd1ohNb1&exp=1794026855&osig=AAAAAAAAAAAAAAAAAAAAAFcdNz3dohVucR4iDhHINsecxX7OShV-igyc8NMWayWl&signer=media-rpc&token=AAIAAU0AJDAxMzRiOWNjLTNjYTYtNDdiYi05M2NiLTAxNTlhNWE3MDQ3YwAAAAABobRVWljFSaS83gtkWdtRZbSe4LZfTaTpIe41j0LTIgxwaiTH-A&x-canva-quality=thumbnail' -o 'assets/selected-icons/sleepy-cat.jpg'
          curl --fail --location --retry 3 'https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F57d23c37-4e22-4951-bb8b-7991fe69d0ad/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAEWkpFfSxh7aF2k-OWSvmZLxMEqjF-1tqW3AdasM7AJJ&exp=1794028874&osig=AAAAAAAAAAAAAAAAAAAAAHXpt3MUho1PDXKcpU2g0n5m8gs6qHpDowwA4bMppIz1&signer=media-rpc&token=AAIAAU0AJDU3ZDIzYzM3LTRlMjItNDk1MS1iYjhiLTc5OTFmZTY5ZDBhZAAAAAABobR0KRA2YvkaZKvJVwB0NAteYyMJsND6PPAG-I3jDry6a4C9cA&x-canva-quality=thumbnail' -o 'assets/selected-icons/night-watcher.jpg'
          curl --fail --location --retry 3 'https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2Ffb63f895-31df-467b-b311-ab15f1de300b/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAADUiANOHlXBFa7jcicJYXZRQ10DrmdwcKir353u-Yo4u&exp=1794028640&osig=AAAAAAAAAAAAAAAAAAAAACAkN40H-9EsalgX6atSAZXDfe1TBGYDdS7T389Z4TvC&signer=media-rpc&token=AAIAAU0AJGZiNjNmODk1LTMxZGYtNDY3Yi1iMzExLWFiMTVmMWRlMzAwYgAAAAABobRwlwDMXXQ9hezSQBUrYc_cW9gXBQFeFFU_agT-9wWh620Ftw&x-canva-quality=thumbnail' -o 'assets/selected-icons/ink-emblem.jpg'
          curl --fail --location --retry 3 'https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F61ca676c-c4a6-44bc-a5d0-188bad09a9a1/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAG98Wq8U2-4tdYXOqXkYyRI36BYjYQs-nm8uSiFzoB1r&exp=1794026048&osig=AAAAAAAAAAAAAAAAAAAAADtinl1Q_9K6hKxBD6twswnoVTDrwP7T3kuzMBggSbJ3&signer=media-rpc&token=AAIAAU0AJDYxY2E2NzZjLWM0YTYtNDRiYy1hNWQwLTE4OGJhZDA5YTlhMQAAAAABobRJCgA36Rtck4trq1vIi61gEWq2JqYNYiCL12oL0Cw3DN932A&x-canva-quality=thumbnail' -o 'assets/selected-icons/yin-yang.jpg'
      - name: Validate and commit image assets
        shell: bash
        run: |
          set -euo pipefail
          for n in sunny-sprite mono-peek red-cat sleepy-cat night-watcher ink-emblem yin-yang; do
            test -s "assets/selected-icons/$n.jpg"
            file "assets/selected-icons/$n.jpg"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/selected-icons
          git commit -m "Import original user-provided Ascend icon images" || exit 0
          git push origin HEAD:ascend-2.7.6-user-icons
