name: Ascend 2.8 Development QA
on:
  push:
    branches: [ascend-2.8-dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check balanced XP regression tests
        run: node --test tests/progression.test.mjs
      - name: Verify release signing safeguards
        run: python3 -m unittest discover -s tests -p 'test_signing.py' -v
      - name: Check JavaScript bundle for Android
        env:
          NODE_ENV: production
        run: npx expo export --platform android --output-dir dist-qa
      - name: Generate native Android project and widget
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compile Android development build only
        working-directory: android
        env:
          NODE_ENV: development
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Confirm no release APK published
        run: test ! -e android/app/build/outputs/apk/release/app-release.apk
