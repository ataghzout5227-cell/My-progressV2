name: Ascend 2.8 Development QA
on:
  push:
    branches: [ascend-2.8-dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check balanced XP regression tests
        run: node --test tests/progression.test.mjs
      - name: Verify release signing safeguards
        run: python3 -m unittest discover -s tests -p 'test_signing.py' -v
      - name: Check JavaScript bundle for Android
        env:
          NODE_ENV: production
        run: npx expo export --platform android --output-dir dist-qa
      - name: Generate native Android project and widget
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compile Android development build only
        working-directory: android
        env:
          NODE_ENV: development
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      # Test builds are deliberately temporary/debug-signed. Never use for permanent updates.
      # The production build on main still requires the four persistent signing secrets.
      - name: Build standalone TEST APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon
      - name: Validate test APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tail -n 2
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)'
          cp "$APK" "Ascend-2.8-beta.apk"
      - name: Publish direct TEST APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="ascend-2.8-beta"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Ascend 2.8 BETA — test only" --prerelease --notes "TEST ONLY. Temporary debug signing: not compatible with future in-place updates. Separate com.ascend.mobile app, so Ascend 2.7.1 remains installed. Export 2.7.1 Journal data privately and import into 2.8. Do not uninstall the older app before checking everything."
          gh release upload "$TAG" "Ascend-2.8-beta.apk" --clobber
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ascend-2.8-Beta-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
