name: Build Ascend APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || (echo 'Android SDK platforms missing' && exit 1)
      - name: Detect source folder
        id: source
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f my-progress-tracker/package.json ]; then
            echo "dir=my-progress-tracker" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing application source. Upload extracted Ascend source files to this repository."
            exit 1
          fi
      - name: Install dependencies
        working-directory: ${{ steps.source.outputs.dir }}
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: ${{ steps.source.outputs.dir }}
        run: npx expo prebuild --platform android --clean --no-install
      - name: Require persistent signing secrets
        shell: bash
        env:
          ASCEND_KEYSTORE_BASE64: ${{ secrets.ASCEND_KEYSTORE_BASE64 }}
          ASCEND_KEYSTORE_PASSWORD: ${{ secrets.ASCEND_KEYSTORE_PASSWORD }}
          ASCEND_KEY_ALIAS: ${{ secrets.ASCEND_KEY_ALIAS }}
          ASCEND_KEY_PASSWORD: ${{ secrets.ASCEND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ASCEND_KEYSTORE_BASE64 ASCEND_KEYSTORE_PASSWORD ASCEND_KEY_ALIAS ASCEND_KEY_PASSWORD; do
            test -n "${!v}" || { echo "::error::Required signing secret $v is not configured. Refusing release."; exit 1; }
          done
          printf '%s' "$ASCEND_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ascend-release.jks"
          test -s "$RUNNER_TEMP/ascend-release.jks"
          echo "ASCEND_KEYSTORE_PATH=$RUNNER_TEMP/ascend-release.jks" >> "$GITHUB_ENV"
          echo "ASCEND_KEYSTORE_PASSWORD=$ASCEND_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ASCEND_KEY_ALIAS=$ASCEND_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ASCEND_KEY_PASSWORD=$ASCEND_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Configure release signing
        working-directory: ${{ steps.source.outputs.dir }}
        run: python3 scripts/configure-release-signing.py
      - name: Build standalone APK with embedded JavaScript
        env:
          NODE_ENV: production
        working-directory: ${{ steps.source.outputs.dir }}/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Validate APK before publishing
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tail -n 2
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)" 
          cp "$APK" "Ascend-2.8.0.apk"
      - name: Publish direct APK on GitHub Releases
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="ascend-2.8.0"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Ascend 2.8.0" --notes "Balanced XP, Analytics, Focus Mode, unlockable themes and Android home widget. New secure signing identity, explicit legacy backup import, and saved Journal and appearance settings."
          gh release upload "$TAG" "Ascend-2.8.0.apk" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ascend-2.8.0-APK
          path: ${{ steps.source.outputs.dir }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
