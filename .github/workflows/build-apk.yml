name: Build Ascend APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || (echo 'Android SDK platforms missing' && exit 1)
      - name: Detect source folder
        id: source
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f my-progress-tracker/package.json ]; then
            echo "dir=my-progress-tracker" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing application source. Upload extracted Ascend source files to this repository."
            exit 1
          fi
      - name: Install dependencies
        working-directory: ${{ steps.source.outputs.dir }}
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: ${{ steps.source.outputs.dir }}
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone APK with embedded JavaScript
        env:
          NODE_ENV: production
        working-directory: ${{ steps.source.outputs.dir }}/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Validate APK before publishing
        working-directory: ${{ steps.source.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tail -n 2
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)" 
          cp "$APK" "Ascend-2.7.5.apk"
      - name: Publish direct APK on GitHub Releases
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="ascend-2.7.5"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Ascend 2.7.5" --notes "Ascend 2.7.5: fix compact mascot selector and make Samsung launcher selection immediate; existing Books, Journal, cloud sync and theme customization retained."
          gh release upload "$TAG" "Ascend-2.7.5.apk" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ascend-2.7.5-APK
          path: ${{ steps.source.outputs.dir }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
