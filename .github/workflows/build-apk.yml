name: Build Ascend APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms" || (echo 'Android SDK platforms missing' && exit 1)
      - name: Detect source folder
        id: source
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f my-progress-tracker/package.json ]; then
            echo "dir=my-progress-tracker" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing application source. Upload extracted Ascend source files to this repository."
            exit 1
          fi
      - name: Install dependencies
        working-directory: ${{ steps.source.outputs.dir }}
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: ${{ steps.source.outputs.dir }}
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone APK with embedded JavaScript
        env:
          NODE_ENV: production
        working-directory: ${{ steps.source.outputs.dir }}/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ascend-Electric-2.4-APK
          path: ${{ steps.source.outputs.dir }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
