name: Ascend 2.7.5 Icon Fix QA
on:
  push:
    branches: [ascend-2.7.5-icon-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies and generate icons
        run: npm install --no-audit --no-fund
      - name: Validate mascot icon images
        run: |
          for name in cat ghost bunny doodle flame; do test -s "assets/mascots/$name.png"; done
      - name: Export Android JavaScript
        env:
          NODE_ENV: production
        run: npx expo export --platform android --output-dir dist-qa
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compile standalone release
        working-directory: android
        env:
          NODE_ENV: production
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify "$APK"
          "$BUILD_TOOLS/zipalign" -c 4 "$APK"
