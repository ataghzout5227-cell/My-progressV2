name: Ascend Books and Supabase QA
on:
  push:
    branches: [ascend-2.7-books]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Bundle Android JS with Books and Supabase code
        env:
          NODE_ENV: production
        run: npx expo export --platform android --output-dir dist-qa
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compile standalone release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify installable APK signature and structure
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tail -n 2
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:)"
