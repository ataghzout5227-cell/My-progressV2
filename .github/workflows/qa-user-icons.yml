name: Ascend 2.7.6 User Icons QA
on:
  push:
    branches: [ascend-2.7.6-user-icons]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies and decode user supplied photos
        run: npm install --no-audit --no-fund
      - name: Check exactly seven icon assets
        run: |
          for name in sunny-sprite mono-peek red-cat sleepy-cat night-watcher ink-emblem yin-yang; do
            test -s "assets/selected-icons/$name.jpg"
            test -s "assets/mascots/$name.png"
          done
      - name: Export Android JavaScript
        env:
          NODE_ENV: production
        run: npx expo export --platform android --output-dir dist-test
      - name: Generate Android launcher aliases
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compile release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify "$APK"
          "$BUILD_TOOLS/zipalign" -c 4 "$APK"
